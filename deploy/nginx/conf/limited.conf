# Rate-limit rejections in the API's error shape. Never cached: a shared cache must not
# hand one client's 429 to everyone behind the edge.
error_page 429 @limited;

location @limited {
    default_type application/json;
    add_header Retry-After 5 always;
    add_header Cache-Control no-store always;
    return 429 '{"detail":"Too many requests"}\n';
}

location @auth_limited {
    default_type application/json;
    add_header Retry-After 60 always;
    add_header Cache-Control no-store always;
    return 429 '{"detail":"Too many requests"}\n';
}
