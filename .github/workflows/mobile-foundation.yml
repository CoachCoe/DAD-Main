name: Mobile foundation contract
on:
  push:
    branches: [dev, main]
    tags: ['mobile-foundation-v*']
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    # Fork safety (public repo): run self-hosted only for pushes and same-repo
    # PRs, never a fork's PR.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, dad, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: make check-mobile
      - run: node scripts/mobile-foundation.mjs bundle "$RUNNER_TEMP/foundation"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dad-mobile-foundation
          path: ${{ runner.temp }}/foundation/
          if-no-files-found: error
  swift-compatibility:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, dad, macos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Compile the actual contract with pinned Apple tooling
        run: |
          node scripts/mobile-foundation.mjs bundle "$RUNNER_TEMP/foundation"
          cp -R contracts/mobile/swift "$RUNNER_TEMP/swift"
          cp "$RUNNER_TEMP/foundation/mobile.openapi.json" "$RUNNER_TEMP/swift/Sources/DADAPI/openapi.json"
          cp "$RUNNER_TEMP/foundation/DADTokens.swift" "$RUNNER_TEMP/swift/Sources/DADAPI/DADTokens.swift"
          swift test --package-path "$RUNNER_TEMP/swift" --scratch-path "$RUNNER_TEMP/swift-build" --force-resolved-versions
  publish:
    if: startsWith(github.ref, 'refs/tags/mobile-foundation-v')
    needs: [contract, swift-compatibility]
    runs-on: [self-hosted, dad, linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Publish the matching immutable version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("contracts/mobile/version.json")).version')
          test "$GITHUB_REF_NAME" = "mobile-foundation-v$VERSION"
          node scripts/mobile-foundation.mjs bundle "$RUNNER_TEMP/foundation"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/foundation/* --verify-tag \
            --title "DAD mobile foundation $VERSION" \
            --notes "Versioned API contract, design tokens, and app-link rules. See docs/mobile-foundation.md."
