name: ATM validation

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      ledger_operation:
        description: Ledger operation (administrative operations require an authorized owner)
        type: choice
        options: [validate, migrate, triage, history, recover]
        default: validate
      finding:
        type: string
        description: Finding ID for audited triage
      severity:
        type: choice
        options: [unassessed, low, medium, high, critical]
        default: medium
      disposition:
        type: choice
        options: [untriaged, confirmed, resolved, dismissed]
        default: resolved
      note_digest:
        type: string
        description: SHA-256 of the retained private review note (never its contents)

env:
  ATM_LEDGER_URL: ${{ vars.ATM_LEDGER_URL }}
  ATM_LEDGER_BACKEND: ${{ vars.ATM_LEDGER_BACKEND || 'git' }}

permissions:
  contents: read

# Serialize state changes. A replaced pending run never produces a passing gate.
concurrency:
  group: atm-findings-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      vars.ATM_LEDGER_BACKEND != 'paused' &&
      (github.event_name != 'workflow_dispatch' || inputs.ledger_operation == 'validate') &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')))
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      id-token: write
    environment: atm-ledger-reader
    outputs:
      revision: ${{ steps.candidate.outputs.revision }}
      artifact_id: ${{ steps.evidence.outputs.artifact-id }}
      artifact_digest: ${{ steps.evidence.outputs.artifact-digest }}
    steps:
      - name: Pin candidate
        id: candidate
        env:
          CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$CANDIDATE" =~ ^[a-f0-9]{40}$ ]]
          echo "revision=$CANDIDATE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.revision }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CoachCoe/atm
          ref: 3d5179a41ada263c554987cf499878b955ff0147
          path: atm
          persist-credentials: false
          token: ${{ secrets.ATM_READ_TOKEN || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: vars.ATM_LEDGER_BACKEND != 'durable'
        with:
          ref: atm-state
          path: state
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: atm
      - run: npx playwright install --with-deps chromium
        working-directory: atm
      - name: Read durable ledger snapshot
        if: vars.ATM_LEDGER_BACKEND == 'durable'
        run: |
          node candidate/scripts/atm-ledger.mjs snapshot state atm
          mkdir -p "$RUNNER_TEMP/atm"
          cp state/snapshot.json "$RUNNER_TEMP/atm/snapshot.json"
      - name: Validate isolated candidate
        env:
          CANDIDATE: ${{ steps.candidate.outputs.revision }}
          SOURCE: github:${{ github.repository }}
          EXECUTION: ${{ github.run_id }}:${{ github.run_attempt }}
        # Keep detailed errors out of the public Actions log. The encrypted
        # bundle contains declared evidence; never upload the whole run folder.
        run: |
          mkdir -p "$RUNNER_TEMP/atm"
          node atm/scripts/github-ci.js run \
            --repo candidate --revision "$CANDIDATE" --source "$SOURCE" \
            --state state/ledger.json --execution "$EXECUTION" \
            --public-key atm/integrations/github/impactgraph-evidence.pub.pem \
            --output "$RUNNER_TEMP/atm" > "$RUNNER_TEMP/atm-console.log" 2>&1
      - name: Retain encrypted evidence and public proposal
        id: evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atm-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/atm/evidence.atm
            ${{ runner.temp }}/atm/proposal.json
            ${{ runner.temp }}/atm/snapshot.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  persist:
    needs: validate
    if: ${{ always() && needs.validate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    environment: atm-ledger-publisher
    outputs:
      verdict: ${{ steps.publish.outputs.verdict }}
    steps:
      # This fresh runner never builds or executes candidate code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CoachCoe/atm
          ref: 3d5179a41ada263c554987cf499878b955ff0147
          path: atm
          persist-credentials: false
          token: ${{ secrets.ATM_READ_TOKEN || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: vars.ATM_LEDGER_BACKEND != 'durable'
        with:
          ref: atm-state
          path: state
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: vars.ATM_LEDGER_BACKEND == 'durable'
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: proposal
          merge-multiple: true
      - name: Verify and persist verdict
        id: publish
        env:
          CANDIDATE: ${{ needs.validate.outputs.revision }}
          SOURCE: github:${{ github.repository }}
          EXECUTION: ${{ github.run_id }}:${{ github.run_attempt }}
          ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.validate.outputs.artifact_digest }}
          ATM_PROPOSAL_DIR: proposal
        run: |
          if [ "$ATM_LEDGER_BACKEND" = durable ]; then
            node control/scripts/atm-ledger.mjs publish proposal atm
            exit
          fi
          node atm/scripts/github-ci.js publish \
            --source "$SOURCE" --execution "$EXECUTION" --revision "$CANDIDATE" \
            --state state/ledger.json --proposal proposal/proposal.json \
            --bundle proposal/evidence.atm --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$ARTIFACT_DIGEST" --output "$RUNNER_TEMP/verdict"
          cd state
          git config user.name 'ATM quality gate'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledger.json
          git commit -m "Record ATM validation $EXECUTION"
          # No force-push: a concurrent triage/state change fails closed.
          git push origin HEAD:refs/heads/atm-state
          echo "verdict=$(cat "$RUNNER_TEMP/verdict")" >> "$GITHUB_OUTPUT"

  acceptance:
    name: ATM acceptance
    needs: [validate, persist]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.ledger_operation == 'validate') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require validated, retained and persisted acceptance
        env:
          VALIDATION: ${{ needs.validate.result }}
          PERSISTENCE: ${{ needs.persist.result }}
          VERDICT: ${{ needs.persist.outputs.verdict }}
        run: |
          test "$VALIDATION" = success
          test "$PERSISTENCE" = success
          test "$VERDICT" = eligible
          echo 'ATM acceptance passed. This does not authorize production deployment.'

  ledger-admin:
    if: github.event_name == 'workflow_dispatch' && inputs.ledger_operation != 'validate'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: atm-ledger-admin
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CoachCoe/atm
          ref: 3d5179a41ada263c554987cf499878b955ff0147
          path: atm
          persist-credentials: false
          token: ${{ secrets.ATM_READ_TOKEN || github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Perform authorized ledger operation
        env:
          OPERATION: ${{ inputs.ledger_operation }}
          ATM_FINDING: ${{ inputs.finding }}
          ATM_SEVERITY: ${{ inputs.severity }}
          ATM_DISPOSITION: ${{ inputs.disposition }}
          ATM_NOTE_DIGEST: ${{ inputs.note_digest }}
          ATM_LEGACY_REPO: control
        run: |
          if [ "$OPERATION" = migrate ]; then
            export ATM_LEGACY_REVISION
            ATM_LEGACY_REVISION="$(git -C control rev-parse origin/atm-state)"
          fi
          node control/scripts/atm-ledger.mjs "$OPERATION" "$RUNNER_TEMP/ledger-operation" atm
      - name: Retain verified history export
        if: inputs.ledger_operation == 'history'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atm-ledger-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ledger-operation/history.json
          if-no-files-found: error
