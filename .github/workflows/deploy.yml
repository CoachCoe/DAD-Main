name: Deploy (app)

# Application rollout pipeline. This does the DIRECT ECS deploy and does NOT use
# CDK (CDK is reserved for infra changes, which live in the DAD-infra repo's
# dad-main-infra.yml). The step order mirrors
# scripts/deploy.sh exactly:
#
#   build/push images -> pin task definitions to the image tag
#     -> migrate (run-task, waited on) -> provision-roles (run-task, waited on)
#     -> roll api/web/nginx ("up") and wait for each new deployment to COMPLETE
#     -> workers (roll the six worker services the same way),
#        behind DONOR_GO_WORKERS_ENABLED
#
# Staging runs automatically on a merge to dev. Production runs on a release tag
# or a merge to main, gated by the `production` GitHub Environment manual-approval
# protection rule (configured in repo settings, not in YAML).
#
# Cluster and network ids are read from the CDK CloudFormation outputs at
# runtime, never hardcoded. ECS service names match docker-compose.prod.yml
# exactly: api, web, nginx, stripe-worker, projection-worker, login-email-worker,
# email-change-worker, message-worker, push-worker.
#
# Auth is GitHub OIDC assuming the FEAT-002 app-deploy role (no static keys);
# the role ARN is read from the environment variable vars.APP_DEPLOY_ROLE_ARN.

on:
  push:
    branches: [dev, main]
    paths:
      - "apps/**"
      - "deploy/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Only run once the account is bootstrapped and the OIDC app-deploy role ARN
    # is configured as the per-environment variable APP_DEPLOY_ROLE_ARN. Before
    # bootstrap the variable is empty, so the job is skipped (green) instead of
    # hard-failing on a role that does not exist yet. The pipeline "wakes up" on
    # the first push/release after the variable is set. See docs/aws-deployment.md
    # and https://github.com/CoachCoe/DAD-infra (apps/dad-main).
    # Releases are also cut for the mobile contract (mobile-foundation-v*). Those are
    # not application releases and must never start a deploy.
    if: >-
      ${{ vars.APP_DEPLOY_ROLE_ARN != '' &&
      !(github.event_name == 'release' && startsWith(github.event.release.tag_name, 'mobile-foundation-')) }}
    # Resolve the environment from the trigger: dev push -> staging; release tag
    # or main push -> production; workflow_dispatch -> the chosen input.
    environment: >-
      ${{
        github.event_name == 'workflow_dispatch' && inputs.env
        || ((github.event_name == 'release' || github.ref == 'refs/heads/main') && 'production' || 'staging')
      }}
    env:
      # The CloudFormation stack that carries the ECS cluster/service outputs
      # (ecs-cluster stack). The env suffix is derived from the GitHub Environment.
      DAD_ENV: >-
        ${{
          github.event_name == 'workflow_dispatch' && inputs.env
          || ((github.event_name == 'release' || github.ref == 'refs/heads/main') && 'production' || 'staging')
        }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.APP_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve cluster/subnets/security-groups from CDK stack outputs
        id: names
        # The CloudFormation outputs published by DAD-infra's apps/dad-main stacks
        # (dad-<name>-<env>) are the only source; names are never hardcoded. The app
        # deploy role reads them via cloudformation:DescribeStacks (DAD-infra
        # pipeline-iam-stack). A missing stack or output fails the step with a message
        # that names it, rather than being swallowed.
        run: |
          set -euo pipefail
          out() {
            # out <stack-suffix> <OutputKey>
            local stack="dad-$1-${DAD_ENV}" key="$2" val
            # No stderr redirect: an AccessDenied or ValidationError should be visible.
            val="$(aws cloudformation describe-stacks --stack-name "$stack" \
              --query "Stacks[0].Outputs[?OutputKey=='$key'].OutputValue" \
              --output text)" || val=""
            if [ -z "$val" ] || [ "$val" = "None" ]; then
              echo "::error::Stack '$stack' has no output '$key'. Is DAD-infra apps/dad-main deployed for ${DAD_ENV}?" >&2
              exit 1
            fi
            printf '%s' "$val"
          }
          cluster="$(out ecs-cluster ClusterName)"
          subnets="$(out network ComputeSubnetIds)"
          sgs="$(out network WorkersSecurityGroupId)"
          {
            echo "cluster=$cluster"
            echo "subnets=$subnets"
            echo "sgs=$sgs"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved cluster=$cluster subnets=$subnets sgs=$sgs"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        id: ecr

      - name: Build and push images (dad/api, dad/web, dad/nginx) tagged with the git SHA
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          # Origins are web image BUILD ARGS (not runtime env); the web image MUST
          # be rebuilt whenever an origin changes. They come from environment vars.
          DONOR_PUBLIC_ORIGIN: ${{ vars.DONOR_PUBLIC_ORIGIN }}
          DONOR_STAFF_ORIGIN: ${{ vars.DONOR_STAFF_ORIGIN }}
        run: |
          set -euo pipefail
          docker build -t "$REGISTRY/dad/api:$IMAGE_TAG" -f apps/donor-api/Dockerfile apps/donor-api
          docker build -t "$REGISTRY/dad/web:$IMAGE_TAG" \
            --build-arg "DONOR_PUBLIC_ORIGIN=$DONOR_PUBLIC_ORIGIN" \
            --build-arg "DONOR_STAFF_ORIGIN=$DONOR_STAFF_ORIGIN" \
            -f apps/web/Dockerfile apps/web
          docker build -t "$REGISTRY/dad/nginx:$IMAGE_TAG" -f deploy/nginx/Dockerfile deploy/nginx
          docker push "$REGISTRY/dad/api:$IMAGE_TAG"
          docker push "$REGISTRY/dad/web:$IMAGE_TAG"
          docker push "$REGISTRY/dad/nginx:$IMAGE_TAG"

      # Register a task-definition revision per family pinned to this image tag. The CDK
      # task definitions carry a placeholder tag, and an ECS service or run-task runs a
      # specific revision, so the SHA-tagged images above are only deployed once a
      # revision points at them. The `family=ARN` lines it prints are saved to a file the
      # steps below read through DAD_TASKDEFS_FILE (run-task.sh and ecs-rollout.sh).
      - name: Pin task definitions to this image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./scripts/ecs-pin-image.sh "$IMAGE_TAG" \
            dad-api dad-web dad-nginx \
            dad-stripe-worker dad-projection-worker dad-login-email-worker \
            dad-email-change-worker dad-message-worker dad-push-worker \
            dad-maint-migrate dad-maint-provision-roles dad-maint-staff \
            dad-maint-rekey dad-maint-monitor dad-maint-reconcile \
            > "$RUNNER_TEMP/taskdefs.txt"
          echo "DAD_TASKDEFS_FILE=$RUNNER_TEMP/taskdefs.txt" >> "$GITHUB_ENV"

      # --- Rollout order mirrors scripts/deploy.sh exactly ---

      # 1) migrate: run the schema migrations first (owner DONOR_GO_DATABASE_URL). The
      #    script waits for the task and fails unless its container exits 0.
      - name: migrate (ECS run-task)
        env:
          DAD_CLUSTER: ${{ steps.names.outputs.cluster }}
          DAD_SUBNETS: ${{ steps.names.outputs.subnets }}
          DAD_SECURITY_GROUPS: ${{ steps.names.outputs.sgs }}
        run: ./scripts/run-task.sh "$DAD_ENV" migrate

      # 2) provision-roles: runs AFTER migrate; creates/grants the per-process
      #    Postgres roles (owner + all per-process DONOR_*_DATABASE_URL).
      - name: provision-roles (ECS run-task)
        env:
          DAD_CLUSTER: ${{ steps.names.outputs.cluster }}
          DAD_SUBNETS: ${{ steps.names.outputs.subnets }}
          DAD_SECURITY_GROUPS: ${{ steps.names.outputs.sgs }}
        run: ./scripts/run-task.sh "$DAD_ENV" provision-roles

      # 3) the "up" step: roll the long-running services api, web, nginx, and gate on
      #    each new deployment reaching COMPLETED. The services have container health
      #    checks and the ECS deployment circuit breaker with rollback (DAD-infra
      #    apps/dad-main), so a deployment whose tasks fail to start or stay healthy ends
      #    FAILED and this step fails. This replaces the old ECS Exec smoke checks: no
      #    shell into a running task, no Session Manager plugin, no extra IAM.
      #    See scripts/ecs-rollout.sh for why it keys on the deployment it started.
      - name: roll api/web/nginx and wait for the rollout (the up step)
        env:
          CLUSTER: ${{ steps.names.outputs.cluster }}
        run: ./scripts/ecs-rollout.sh "$CLUSTER" api web nginx

      # 4) workers: roll the six worker services last, only when workers are on.
      #    Gated on DONOR_GO_WORKERS_ENABLED (environment variable).
      - name: roll workers and wait for the rollout (gated on DONOR_GO_WORKERS_ENABLED)
        if: ${{ vars.DONOR_GO_WORKERS_ENABLED == 'true' }}
        env:
          CLUSTER: ${{ steps.names.outputs.cluster }}
        run: |
          ./scripts/ecs-rollout.sh "$CLUSTER" \
            stripe-worker projection-worker login-email-worker \
            email-change-worker message-worker push-worker
