name: CI
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: go_test
          POSTGRES_PASSWORD: go_test
          POSTGRES_DB: donor_go
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U go_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DONOR_GO_DATABASE_URL: postgresql://go_test:go_test@localhost:5432/donor_go
      TEST_DATABASE_URL: postgresql://go_test:go_test@localhost:5432/donor_go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: apps/donor-api/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      - run: make migrate
      - run: make check-generated
      - run: make test-donor-go
      - run: make lint-go

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      - run: make test-web
      - run: make lint-web

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make lint-scripts
      - run: make check-ingress smoke-ingress
      - name: Validate production compose
        run: |
          sed -e 's/^IMAGE_TAG=$/IMAGE_TAG=ci/' .env.production.example > "$RUNNER_TEMP/ci.env"
          sed -e 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' .env.database.example > "$RUNNER_TEMP/ci-database.env"
          ENV_FILE="$RUNNER_TEMP/ci.env" docker compose --env-file "$RUNNER_TEMP/ci.env" --env-file "$RUNNER_TEMP/ci-database.env" \
            -f docker-compose.prod.yml --profile workers --profile maintenance config -q
      - run: make check-images

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        production: ["0", "1"]
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: go_test
          POSTGRES_PASSWORD: go_test
          POSTGRES_DB: donor_go
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U go_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DONOR_GO_DATABASE_URL: postgresql://go_test:go_test@localhost:5432/donor_go
      DONOR_API_BASE_URL: http://127.0.0.1:8002
      DONOR_PUBLIC_ORIGIN: http://127.0.0.1:3000
      DONOR_STAFF_ORIGIN: http://staff.localhost:3000
      E2E_PRODUCTION: ${{ matrix.production }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: apps/donor-api/go.sum
      - run: make migrate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: make test-browser-e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: browser-failures-production-${{ matrix.production }}
          path: apps/web/test-results
