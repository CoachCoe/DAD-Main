name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: go_test
          POSTGRES_PASSWORD: go_test
          POSTGRES_DB: donor_go
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U go_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DONOR_GO_DATABASE_URL: postgresql://go_test:go_test@localhost:5432/donor_go
      TEST_DATABASE_URL: postgresql://go_test:go_test@localhost:5432/donor_go
    defaults:
      run:
        working-directory: apps/donor-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: apps/donor-api/go.sum
      - run: go run ./cmd/migrate
      - run: docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.31.1 generate && git diff --exit-code -- internal/store/queries
      - run: test -z "$(gofmt -l .)" && go vet ./... && go test -race ./... && go build ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint && npm test -- --run && npm exec next typegen && npm run typecheck && npm run build

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: go_test
          POSTGRES_PASSWORD: go_test
          POSTGRES_DB: donor_go
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U go_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DONOR_GO_DATABASE_URL: postgresql://go_test:go_test@localhost:5432/donor_go
      DONOR_API_BASE_URL: http://127.0.0.1:8002
      DONOR_PUBLIC_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: apps/donor-api/go.sum
      - run: go run ./cmd/migrate
        working-directory: apps/donor-api
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: apps/web/test-results
