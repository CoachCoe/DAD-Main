name: CI
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path gate: the hosted jobs (api, browser, deploy) run on GitHub-hosted
  # Ubuntu and bill minutes. This self-hosted job diffs the change and emits
  # booleans so each hosted job runs only when files it tests changed, and
  # always on a push to main or dev, which keeps the full suite. Those jobs are
  # hosted because they need Postgres service containers, `playwright install
  # --with-deps`, and Docker; a self-hosted runner that provides containers
  # could take them over by changing their `runs-on` and dropping the gate.
  changes:
    # Fork safety (public repo): self-hosted jobs run only for pushes and
    # same-repo PRs, never a fork's PR — a forked PR must not execute code on
    # the self-hosted runner. GitHub-hosted jobs (api/browser/deploy) run in
    # GitHub's sandbox and are additionally gated by the repo's "require
    # approval for fork PRs" setting.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, dad, linux]
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      deploy: ${{ steps.filter.outputs.deploy }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          backend=false deploy=false full=false
          # A push to an integration branch runs the full suite regardless of the
          # diff: this is the landing run, and a skipped job there would leave a
          # gap no later trigger fills.
          if [ "$EVENT" = "push" ] && { [ "$REF" = "refs/heads/main" ] || [ "$REF" = "refs/heads/dev" ]; }; then
            full=true backend=true deploy=true
          else
            # Resolve the comparison base: a PR diffs against its merge base, a
            # branch push against its before-SHA (or HEAD~1 when that is unset,
            # e.g. a new branch's first push).
            if [ "$EVENT" = "pull_request" ] && [ -n "${BASE_SHA:-}" ]; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
              base="$BASE_SHA"
            elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              base="$BEFORE"
            else
              base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            fi
            changed="$(git diff --name-only "$base" HEAD || true)"
            echo "changed files vs $base:"; echo "$changed"
            match() { echo "$changed" | grep -Eq "$1"; }
            # backend: Go API, its migrations/sqlc/openapi, the web app (api runs
            # check-generated which spans web typegen; browser is full-stack E2E),
            # or the CI workflow itself.
            if match '^apps/donor-api/|^apps/web/|^scripts/|^contracts/mobile/|^Makefile$|^\.github/workflows/ci\.yml$'; then backend=true; fi
            # deploy: compose/env/ingress/scripts/Dockerfiles, or the CI workflow.
            if match '^docker-compose|^\.env\..*\.example$|^scripts/|[Dd]ockerfile|^\.dockerignore$|^Makefile$|^deploy/nginx/|^\.github/workflows/ci\.yml$'; then deploy=true; fi
          fi
          {
            echo "full=$full"
            echo "backend=$backend"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"

  ledger:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, dad, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # No cache: npm — on a persistent self-hosted runner ~/.npm already
        # survives between runs, and the setup-node cache-save post-step (tar +
        # zstdmt of the npm cache) can hang for minutes and blow the job timeout.
        with: { node-version: "24" }
      - run: npm ci
        working-directory: apps/atm-ledger
      - run: make test-ledger lint-ledger

  api:
    # GitHub-hosted: uses a Postgres service container, which is a Linux-only
    # Actions feature (the self-hosted macOS runner cannot run service containers).
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: go_test
          POSTGRES_PASSWORD: go_test
          POSTGRES_DB: donor_go
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U go_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DONOR_GO_DATABASE_URL: postgresql://go_test:go_test@localhost:5432/donor_go
      TEST_DATABASE_URL: postgresql://go_test:go_test@localhost:5432/donor_go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: apps/donor-api/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      - run: make migrate
      - run: make check-generated
      - run: make test-donor-go
      - run: make lint-go

  web:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, dad, linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # No cache: npm — see the ledger job; the cache-save post-step can hang
        # on the self-hosted runner and cancel the job at its timeout.
        with: { node-version: "22" }
      - run: npm ci
        working-directory: apps/web
      - run: make test-web
      - run: make lint-web

  deploy:
    # GitHub-hosted: runs `docker build` / `docker compose`. Docker Desktop on the
    # self-hosted macOS runner cannot authenticate image pulls from its headless
    # launchd service (no interactive keychain), so this must stay on Linux.
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make lint-scripts
      - run: make check-ingress smoke-ingress
      - name: Validate production compose
        run: |
          sed -e 's/^IMAGE_TAG=$/IMAGE_TAG=ci/' .env.production.example > "$RUNNER_TEMP/ci.env"
          sed -e 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' .env.database.example > "$RUNNER_TEMP/ci-database.env"
          ENV_FILE="$RUNNER_TEMP/ci.env" docker compose --env-file "$RUNNER_TEMP/ci.env" --env-file "$RUNNER_TEMP/ci-database.env" \
            -f docker-compose.prod.yml --profile workers --profile maintenance config -q
      - run: make check-images

  browser:
    # GitHub-hosted: uses a Postgres service container (Linux-only Actions feature)
    # and `playwright install --with-deps` (apt-get, Linux-only).
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        production: ["0", "1"]
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: go_test
          POSTGRES_PASSWORD: go_test
          POSTGRES_DB: donor_go
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U go_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DONOR_GO_DATABASE_URL: postgresql://go_test:go_test@localhost:5432/donor_go
      DONOR_API_BASE_URL: http://127.0.0.1:8002
      DONOR_PUBLIC_ORIGIN: http://127.0.0.1:3000
      DONOR_STAFF_ORIGIN: http://staff.localhost:3000
      E2E_PRODUCTION: ${{ matrix.production }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: apps/donor-api/go.sum
      - run: make migrate
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: make test-browser-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures-production-${{ matrix.production }}
          path: apps/web/test-results
