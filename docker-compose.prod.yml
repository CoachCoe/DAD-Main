name: impactgraph

# Every donor service receives ENV_FILE, so it holds no database credentials. Each service
# instead gets its own login's URL from the database environment file, which Compose only
# interpolates; see docs/operations.md#database-roles.
x-donor: &donor
  image: ${IMAGE_PREFIX:-impactgraph}/api:${IMAGE_TAG:?set IMAGE_TAG}
  build:
    context: .
    dockerfile: apps/donor-api/Dockerfile
  env_file: ${ENV_FILE:-.env.production}
  depends_on:
    postgres:
      condition: service_healthy
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-impactgraph}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    <<: *donor
    environment:
      DONOR_GO_LISTEN: 0.0.0.0:8002
      # Only the web proxy may supply X-Real-IP; it strips any client-sent copy.
      DONOR_TRUSTED_PROXY_CIDRS: 172.30.42.10/32
      DONOR_STAFF_ORIGIN: ${DONOR_STAFF_ORIGIN:?set DONOR_STAFF_ORIGIN}
      DONOR_API_DATABASE_URL: ${DONOR_API_DATABASE_URL:?set DONOR_API_DATABASE_URL}
    # Wallet signing and push provider keys stay outside the image. Mount them read-only
    # (files readable by uid 10001) and set DONOR_WALLET_*_FILE and DONOR_PUSH_*_FILE to
    # the container paths, for example DONOR_WALLET_GOOGLE_KEY_FILE=/run/secrets/wallet/google.json.
    # volumes:
    #   - /etc/impactgraph/wallet:/run/secrets/wallet:ro
    #   - /etc/impactgraph/push:/run/secrets/push:ro
    ports: ["127.0.0.1:${API_PORT:-8002}:8002"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8002/health/live]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *donor
    command: [migrate]
    profiles: [maintenance]
    environment:
      DONOR_GO_DATABASE_URL: ${DONOR_GO_DATABASE_URL:?set DONOR_GO_DATABASE_URL}

  provision:
    <<: *donor
    command: [provision]
    profiles: [maintenance]
    environment:
      DONOR_GO_DATABASE_URL: ${DONOR_GO_DATABASE_URL:?set DONOR_GO_DATABASE_URL}
      DONOR_API_DATABASE_URL: ${DONOR_API_DATABASE_URL:?set DONOR_API_DATABASE_URL}
      DONOR_WORKER_STRIPE_DATABASE_URL: ${DONOR_WORKER_STRIPE_DATABASE_URL:?set DONOR_WORKER_STRIPE_DATABASE_URL}
      DONOR_WORKER_PROJECTIONS_DATABASE_URL: ${DONOR_WORKER_PROJECTIONS_DATABASE_URL:?set DONOR_WORKER_PROJECTIONS_DATABASE_URL}
      DONOR_WORKER_LOGIN_EMAIL_DATABASE_URL: ${DONOR_WORKER_LOGIN_EMAIL_DATABASE_URL:?set DONOR_WORKER_LOGIN_EMAIL_DATABASE_URL}
      DONOR_WORKER_EMAIL_CHANGES_DATABASE_URL: ${DONOR_WORKER_EMAIL_CHANGES_DATABASE_URL:?set DONOR_WORKER_EMAIL_CHANGES_DATABASE_URL}
      DONOR_WORKER_MESSAGES_DATABASE_URL: ${DONOR_WORKER_MESSAGES_DATABASE_URL:?set DONOR_WORKER_MESSAGES_DATABASE_URL}
      DONOR_WORKER_PUSH_DATABASE_URL: ${DONOR_WORKER_PUSH_DATABASE_URL:?set DONOR_WORKER_PUSH_DATABASE_URL}
      DONOR_MONITOR_DATABASE_URL: ${DONOR_MONITOR_DATABASE_URL:?set DONOR_MONITOR_DATABASE_URL}
      DONOR_STAFF_CLI_DATABASE_URL: ${DONOR_STAFF_CLI_DATABASE_URL:?set DONOR_STAFF_CLI_DATABASE_URL}
      DONOR_REKEY_DATABASE_URL: ${DONOR_REKEY_DATABASE_URL:?set DONOR_REKEY_DATABASE_URL}
      DONOR_RECONCILE_DATABASE_URL: ${DONOR_RECONCILE_DATABASE_URL:?set DONOR_RECONCILE_DATABASE_URL}

  monitor:
    <<: *donor
    command: [monitor]
    profiles: [maintenance]
    environment:
      DONOR_MONITOR_DATABASE_URL: ${DONOR_MONITOR_DATABASE_URL:?set DONOR_MONITOR_DATABASE_URL}

  # Daily read-only reconciliation of Stripe charges and refunds against the
  # database. STRIPE_SECRET_KEY is inherited via env_file like every *donor service.
  reconcile:
    <<: *donor
    command: [reconcile]
    profiles: [maintenance]
    environment:
      DONOR_RECONCILE_DATABASE_URL: ${DONOR_RECONCILE_DATABASE_URL:?set DONOR_RECONCILE_DATABASE_URL}

  staff:
    <<: *donor
    command: [staff]
    profiles: [maintenance]
    environment:
      DONOR_STAFF_CLI_DATABASE_URL: ${DONOR_STAFF_CLI_DATABASE_URL:?set DONOR_STAFF_CLI_DATABASE_URL}

  rekey:
    <<: *donor
    command: [rekey]
    profiles: [maintenance]
    environment:
      DONOR_REKEY_DATABASE_URL: ${DONOR_REKEY_DATABASE_URL:?set DONOR_REKEY_DATABASE_URL}

  stripe-worker:
    <<: *donor
    command: [worker, --kind, stripe]
    profiles: [workers]
    environment:
      DONOR_WORKER_STRIPE_DATABASE_URL: ${DONOR_WORKER_STRIPE_DATABASE_URL:?set DONOR_WORKER_STRIPE_DATABASE_URL}
    restart: unless-stopped

  projection-worker:
    <<: *donor
    command: [worker, --kind, projections]
    profiles: [workers]
    environment:
      DONOR_WORKER_PROJECTIONS_DATABASE_URL: ${DONOR_WORKER_PROJECTIONS_DATABASE_URL:?set DONOR_WORKER_PROJECTIONS_DATABASE_URL}
    restart: unless-stopped

  login-email-worker:
    <<: *donor
    command: [worker, --kind, login-email]
    profiles: [workers]
    environment:
      DONOR_WORKER_LOGIN_EMAIL_DATABASE_URL: ${DONOR_WORKER_LOGIN_EMAIL_DATABASE_URL:?set DONOR_WORKER_LOGIN_EMAIL_DATABASE_URL}
    restart: unless-stopped

  message-worker:
    <<: *donor
    command: [worker, --kind, messages]
    profiles: [workers]
    environment:
      DONOR_WORKER_MESSAGES_DATABASE_URL: ${DONOR_WORKER_MESSAGES_DATABASE_URL:?set DONOR_WORKER_MESSAGES_DATABASE_URL}
    restart: unless-stopped

  email-change-worker:
    <<: *donor
    command: [worker, --kind, email-changes]
    profiles: [workers]
    environment:
      DONOR_WORKER_EMAIL_CHANGES_DATABASE_URL: ${DONOR_WORKER_EMAIL_CHANGES_DATABASE_URL:?set DONOR_WORKER_EMAIL_CHANGES_DATABASE_URL}
    restart: unless-stopped

  # Push provider keys stay outside the image, like the API's Wallet keys: mount them
  # read-only and set DONOR_PUSH_APNS_KEY_FILE and DONOR_PUSH_FCM_KEY_FILE to the
  # container paths. The API reads the same settings to accept device registrations.
  push-worker:
    <<: *donor
    command: [worker, --kind, push]
    profiles: [workers]
    environment:
      DONOR_WORKER_PUSH_DATABASE_URL: ${DONOR_WORKER_PUSH_DATABASE_URL:?set DONOR_WORKER_PUSH_DATABASE_URL}
    # volumes:
    #   - /etc/impactgraph/push:/run/secrets/push:ro
    restart: unless-stopped

  web:
    image: ${IMAGE_PREFIX:-impactgraph}/web:${IMAGE_TAG:?set IMAGE_TAG}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        DONOR_PUBLIC_ORIGIN: ${DONOR_PUBLIC_ORIGIN:?set DONOR_PUBLIC_ORIGIN}
        DONOR_STAFF_ORIGIN: ${DONOR_STAFF_ORIGIN:?set DONOR_STAFF_ORIGIN}
        DONOR_IOS_APP_ID: ${DONOR_IOS_APP_ID-}
        DONOR_ANDROID_APP_PACKAGE: ${DONOR_ANDROID_APP_PACKAGE-}
        DONOR_ANDROID_APP_CERT_SHA256: ${DONOR_ANDROID_APP_CERT_SHA256-}
    environment:
      DONOR_API_BASE_URL: http://api:8002
      # nginx overwrites this header with the client address on every request. No host
      # port is published: a local process could otherwise set it to any address.
      DONOR_CLIENT_IP_HEADER: ${DONOR_CLIENT_IP_HEADER-X-Real-IP}
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.30.42.10
      edge: {}
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  # The only service with public ports. It reaches the web service alone, over the edge
  # network; the API and database stay on the default network.
  nginx:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    user: "101:101"
    environment:
      INGRESS_MODE: ${INGRESS_MODE:-cloudflare}
      DONOR_PUBLIC_ORIGIN: ${DONOR_PUBLIC_ORIGIN:?set DONOR_PUBLIC_ORIGIN}
      DONOR_STAFF_ORIGIN: ${DONOR_STAFF_ORIGIN:?set DONOR_STAFF_ORIGIN}
      NGINX_ENVSUBST_FILTER: ^INGRESS_
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/05-ingress.envsh:/docker-entrypoint.d/05-ingress.envsh:ro
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/nginx/conf:/etc/nginx/ingress:ro
      # fullchain.pem and privkey.pem, readable by uid 101.
      - ${INGRESS_TLS_DIR:-/etc/impactgraph/tls}:/etc/nginx/tls:ro
      - ${INGRESS_ORIGIN_PULL_CA:-./deploy/nginx/cloudflare-origin-pull-ca.pem}:/etc/nginx/origin-pull-ca.pem:ro
      - ${INGRESS_STAFF_ACCESS:-./deploy/nginx/staff-access.conf}:/etc/nginx/staff-access.conf:ro
    tmpfs:
      - /tmp:size=64m,uid=101,gid=101,mode=0700
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101,mode=0700
    ports: ["80:8080", "443:8443"]
    # Set by scripts/deploy.sh; a change makes Compose recreate the container.
    labels:
      org.impactgraph.ingress-config: ${INGRESS_CONFIG_HASH:-}
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
    ulimits:
      nofile: 65536
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/health]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  # IPv6 lets published ports deliver IPv6 clients with their own addresses; without it,
  # Docker's proxy presents them all as the gateway, sharing one rate-limit quota.
  edge:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd42:dad:ed9e::/64
  default:
    ipam:
      config:
        # Dynamic addresses come from ip_range so the web proxy's fixed address stays free.
        - subnet: 172.30.42.0/24
          ip_range: 172.30.42.128/25

volumes:
  postgres-data:
