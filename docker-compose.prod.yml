name: impactgraph

x-donor: &donor
  image: ${IMAGE_PREFIX:-impactgraph}/api:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: apps/donor-api/Dockerfile
  env_file: ${ENV_FILE:-.env.production}
  depends_on:
    postgres:
      condition: service_healthy
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-impactgraph}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    <<: *donor
    environment:
      DONOR_GO_LISTEN: 0.0.0.0:8002
    ports: ["127.0.0.1:${API_PORT:-8002}:8002"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8002/health/live]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *donor
    command: [migrate]
    profiles: [maintenance]

  stripe-worker:
    <<: *donor
    command: [worker, --kind, stripe]
    profiles: [workers]
    restart: unless-stopped

  projection-worker:
    <<: *donor
    command: [worker, --kind, projections]
    profiles: [workers]
    restart: unless-stopped

  login-email-worker:
    <<: *donor
    command: [worker, --kind, login-email]
    profiles: [workers]
    restart: unless-stopped

  message-worker:
    <<: *donor
    command: [worker, --kind, messages]
    profiles: [workers]
    restart: unless-stopped

  web:
    image: ${IMAGE_PREFIX:-impactgraph}/web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DONOR_API_BASE_URL: http://api:8002
      DONOR_CLIENT_IP_HEADER: ${DONOR_CLIENT_IP_HEADER:-}
    depends_on:
      api:
        condition: service_healthy
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  postgres-data:
