services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: impactgraph
      POSTGRES_USER: impactgraph
      POSTGRES_PASSWORD: impactgraph
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - impactgraph_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impactgraph -d impactgraph"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Local capture inbox: the app delivers over STARTTLS and never sends real
  # email in development. SMTP on 1025 (STARTTLS, using the mounted cert),
  # web UI on 8025. Generate the cert once — see docs/operations.md,
  # "Capturing mail in development" — and point DONOR_SMTP_CA at certs/mailpit.pem.
  mailpit:
    image: axllent/mailpit:v1.21.0
    environment:
      MP_SMTP_TLS_CERT: /certs/mailpit.pem
      MP_SMTP_TLS_KEY: /certs/mailpit-key.pem
      MP_SMTP_REQUIRE_STARTTLS: "true"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - ./certs:/certs:ro

volumes:
  impactgraph_postgres:
