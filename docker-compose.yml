services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: impactgraph
      POSTGRES_USER: impactgraph
      POSTGRES_PASSWORD: impactgraph
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - impactgraph_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impactgraph -d impactgraph"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  impactgraph_postgres:
