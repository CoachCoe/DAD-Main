version: "2"
sql:
  - engine: "postgresql"
    queries: ["db/monitor.sql", "db/queries.sql", "db/financial.sql", "db/checkout.sql", "db/outbox.sql", "db/worker.sql", "db/email.sql", "db/email_changes.sql", "db/donor.sql", "db/sessions.sql", "db/recurring.sql", "db/staff.sql", "db/admin.sql", "db/admin_finance.sql", "db/content.sql", "db/push.sql"]
    schema: "db/migrations"
    gen:
      go:
        package: "queries"
        out: "internal/store/queries"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        omit_unused_structs: true
